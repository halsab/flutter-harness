name: Harness evolution
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing canonical Harness report number
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: harness-evolution-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'halsab/flutter-harness' && github.actor == github.repository_owner && vars.HARNESS_EVOLUTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      number: ${{ steps.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate canonical owner issue and skip existing fix
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          if ! python3 scripts/evolution.py prepare "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/prompt.txt"; then
            echo "Not a canonical report; skip."
            exit 0
          fi
          if [[ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "evolution/issue-$ISSUE_NUMBER" --state all --json number --jq length)" != 0 ]]; then
            echo "Existing PR; skip."
            exit 0
          fi
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: evolution-prompt
          path: ${{ runner.temp }}/prompt.txt
          retention-days: 1
  investigate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evolution-prompt
          path: ${{ runner.temp }}/evolution-prompt
      - name: Investigate and reproduce in isolated workspace
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/evolution-prompt/prompt.txt
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.HARNESS_EVOLUTION_MODEL }}
          effort: medium
      - name: Export proposed patch only
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/evolution.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-patch
          path: ${{ runner.temp }}/evolution.patch
          retention-days: 1
  verify:
    needs: [prepare, investigate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evolution-patch
          path: ${{ runner.temp }}/evolution-patch
      - name: Validate patch using original policy, then run existing checks
        id: verify
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/evolution-patch/evolution.patch"
          if [[ ! -s "$patch" ]]; then
            echo "No reproduced defect or proposed patch; issue stays open."
            exit 0
          fi
          cp scripts/evolution.py scripts/reporter.py "$RUNNER_TEMP/"
          git apply --index "$patch"
          python3 "$RUNNER_TEMP/evolution.py" validate-patch
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/validate-opencode.py templates/opencode-mobile.jsonc mobile
          python3 scripts/validate-opencode.py templates/opencode-mobile-web.jsonc mobile-web
          node --test scripts/test_delivery_guard.mjs scripts/test_quality_gate.mjs scripts/test_resources.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          echo "ready=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: [prepare, verify]
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evolution-patch
          path: ${{ runner.temp }}/evolution-patch
      - name: Apply validated patch without executing candidate code
        run: |
          set -euo pipefail
          cp scripts/evolution.py scripts/reporter.py "$RUNNER_TEMP/"
          git apply --index "$RUNNER_TEMP/evolution-patch/evolution.patch"
          python3 "$RUNNER_TEMP/evolution.py" validate-patch
      - name: Publish one owner-reviewed PR
        env:
          GH_TOKEN: ${{ secrets.HARNESS_EVOLUTION_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.number }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" && "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          branch="evolution/issue-$ISSUE_NUMBER"
          if [[ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq length)" != 0 ]]; then exit 0; fi
          git switch -c "$branch"
          git -c user.name="Harness Evolution" -c user.email="harness-evolution@users.noreply.github.com" -c core.hooksPath=/dev/null commit -m "fix: investigate Harness report #$ISSUE_NUMBER"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Harness evolution: report #$ISSUE_NUMBER" --body "Closes #$ISSUE_NUMBER. Automated regression candidate; deterministic checks ran in an isolated job. Full PR CI and owner review are required."
