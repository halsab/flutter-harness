name: Bootstrap quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell-and-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      starter_required: ${{ steps.starter_scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
      - name: Select real Flutter starter check
        id: starter_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            required=true
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The checkout is the PR merge candidate. Compare it with the
            # exact base from the event, not an advancing remote branch.
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            if git diff --quiet "$BASE_SHA" HEAD -- \
                scripts/new-project.py scripts/init-product.py scripts/check-product.py \
                templates/product/lib/ templates/product/scaffold/ \
                templates/product/smoke_test.dart.template templates/product/product.json; then
              required=false
            else
              status=$?
              [[ "$status" == 1 ]] || exit "$status"
              required=true
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Real Flutter starter check required: $required"
      - name: Validate Bash syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate default OpenCode configuration
        run: |
          python3 scripts/validate-opencode.py templates/opencode-mobile.jsonc mobile
          python3 scripts/validate-opencode.py templates/opencode-mobile-web.jsonc mobile-web
      - name: Check runtime policy hooks
        run: node --test scripts/test_delivery_guard.mjs scripts/test_quality_gate.mjs scripts/test_resources.mjs
      - name: Run deterministic lifecycle tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Smoke-test both installed profiles
        run: |
          set -euo pipefail
          for profile in mobile mobile-web; do
            tmp="$(mktemp -d)"
            printf 'name: fixture\ndependencies:\n  flutter:\n    sdk: flutter\n' > "$tmp/pubspec.yaml"
            git -C "$tmp" init -q -b app
            bash scripts/install.sh "$tmp" "$profile" app
            bash scripts/install.sh "$tmp" "$profile" app
            test -f "$tmp/.flutter-harness/managed.json"
            test -f "$tmp/.flutter-harness/bin/harness.py"
            test -f "$tmp/.github/workflows/flutter.yml"
            test -f "$tmp/.flutter-harness/PRODUCT.md"
            test ! -f "$tmp/.opencode/skills/flutter-harness/SKILL.md"
            test ! -f "$tmp/.flutter-harness/bin/verify-e2e.py"
            test "$(grep -Fxc '/.flutter-harness/work/' "$tmp/.gitignore")" -eq 1
            test "$(grep -c '<!-- flutter-harness:start -->' "$tmp/AGENTS.md")" -eq 1
            python3 scripts/validate-opencode.py "$tmp/opencode.jsonc" "$profile"
            git -C "$tmp" -c user.name=Harness -c user.email=harness@example.invalid commit -qm seed --allow-empty
            python3 "$tmp/.flutter-harness/bin/harness.py" --project "$tmp" status >/dev/null
            rm -rf "$tmp"
          done
  material-starter:
    needs: shell-and-installer
    if: needs.shell-and-installer.outputs.starter_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Create and exercise real Flutter product through canonical lifecycle
        run: |
          set -euo pipefail
          git config --global user.name Harness
          git config --global user.email harness@example.invalid
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q -b main "$tmp/app"
          git -C "$tmp/app" remote add origin https://github.com/example/starter.git
          touch "$tmp/app/.DS_Store"
          python3 scripts/new-project.py "$tmp/app" harness_product_smoke dev.harness mobile-web main
          test -z "$(git -C "$tmp/app" ls-files -- .DS_Store)"
          git -C "$tmp/app" check-ignore -q .DS_Store
          test "$(git -C "$tmp/app" remote get-url origin)" = "https://github.com/example/starter.git"
          test "$(git -C "$tmp/app" branch --show-current)" = main
